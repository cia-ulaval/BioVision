name: biovision
services:
  biovision:
    build: .
    volumes:
      - .:/app                    # code monté en direct (édition à chaud)
      - ./data:/app/data          # dossier de données local, jamais commité
      - ${VIDEOS_DIR}:/videos:ro  # vidéos sur le disque dur, lecture seule
      - ${FRAMES_DIR}:/frames     # frames extraites, écriture
    ports:
      - "8888:8888"            # JupyterLab
      - "6006:6006"            # TensorBoard, au besoin
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''